name: Northstar Compose validation

on:
  push:
    paths:
      - 'labs/northstar-enterprise/docker/**'
      - '.github/workflows/northstar-compose.yml'
  pull_request:
    paths:
      - 'labs/northstar-enterprise/docker/**'
      - '.github/workflows/northstar-compose.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI environment
        run: cp labs/northstar-enterprise/docker/.env.example labs/northstar-enterprise/docker/.env
      - name: Validate Compose configuration
        run: docker compose --env-file labs/northstar-enterprise/docker/.env -f labs/northstar-enterprise/docker/compose.monitoring.yml config
      - name: Validate PowerShell launcher syntax
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            'labs/northstar-enterprise/docker/Start-MonitoringStack.ps1',
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
