services:
  broker:
    image: rabbitmq:3-management
    hostname: factory-lab-broker
    environment:
      RABBITMQ_DEFAULT_USER: labuser
      RABBITMQ_DEFAULT_PASS: change-me
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - factory_rabbitmq:/var/lib/rabbitmq

volumes:
  factory_rabbitmq:
