name: PowerShell quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify PowerShell
        shell: bash
        run: pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Filter *.ps1 -Recurse -File
          if (-not $files) { throw 'No PowerShell scripts found.' }

          $results = $files | Invoke-ScriptAnalyzer -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize

          $errors = $results | Where-Object Severity -eq 'Error'
          if ($errors) {
            Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)."
            exit 1
          }

          $warnings = $results | Where-Object Severity -eq 'Warning'
          if ($warnings) {
            Write-Warning "PSScriptAnalyzer found $($warnings.Count) warning(s). Review them; warnings do not fail CI."
          }
