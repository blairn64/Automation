services:
  broker:
    image: rabbitmq:3-management
    hostname: lab-broker
    environment:
      RABBITMQ_DEFAULT_USER: labuser
      RABBITMQ_DEFAULT_PASS: change-me
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
